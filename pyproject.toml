[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-image-registration"
version = "0.2.0"
description = "Scientific Lunar Image Registration Pipeline for Chandrayaan-2 (OHRC, TMC-2, IIRS) and LROC Products"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "SIH26166 Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pillow>=10.0.0",
    "lxml>=4.9.0",
    "opencv-python>=4.8.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.1.0"
]
geo = [
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prototype*", "ingestion*", "metadata*", "quality*", "reports*", "orchestrator*", "geospatial*", "preprocessing*", "features*", "matching*", "geometry*", "subpixel*", "registration*", "evaluation*", "models*", "experiments*", "api*", "cli*"]
